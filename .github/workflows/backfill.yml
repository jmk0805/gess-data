name: GESS Historical Backfill (1회 실행)

on:
  workflow_dispatch:  # 수동으로만 실행 (Actions 탭에서 버튼 클릭)

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: pip install httpx

      - name: 과거 데이터 백필 실행
        run: python backfill.py

      - name: prices.json 커밋 & 푸시
        run: |
          git config user.name  "GESS Bot"
          git config user.email "gess-bot@noreply"
          git add data/prices.json
          git diff --staged --quiet || git commit -m "📊 과거 데이터 백필: '25.01 ~ 현재"
          git push
